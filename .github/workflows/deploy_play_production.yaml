name: Google Play production draft (manual or tag)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-upload
  cancel-in-progress: false

jobs:
  validate_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main and, for tags, a matching pubspec version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main || { echo 'Manual production draft must run from main' >&2; exit 1; }
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo 'Tag commit must be on main' >&2; exit 1; }
            version=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)
            test -n "$version" && test "${GITHUB_REF_NAME}" = "v${version}" || { echo 'Tag must equal v<pubspec version>' >&2; exit 1; }
          fi

  upload:
    needs: validate_source
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require Slack notification webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          test -n "$SLACK_WEBHOOK_URL" || { echo 'Missing repository secret: SLACK_WEBHOOK_URL' >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: android
      - name: Prepare production Android configuration and signing
        env:
          CONFIG_DART_BASE64: ${{ secrets.PROD_CONFIG_DART_BASE64 }}
          FIREBASE_OPTIONS_BASE64: ${{ secrets.PROD_FIREBASE_OPTIONS_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.PROD_ANDROID_GOOGLE_SERVICES_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.PROD_ANDROID_KEY_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.PROD_ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_ENV_BASE64: ${{ secrets.PROD_ANDROID_FASTLANE_ENV_BASE64 }}
        run: |
          set -euo pipefail
          for name in CONFIG_DART_BASE64 FIREBASE_OPTIONS_BASE64 GOOGLE_SERVICES_BASE64 KEY_PROPERTIES_BASE64 KEYSTORE_BASE64 PLAY_SERVICE_ACCOUNT_JSON FASTLANE_ENV_BASE64; do
            test -n "${!name}" || { echo "Missing secret: ${name}" >&2; exit 1; }
          done
          printf '%s' "$CONFIG_DART_BASE64" | base64 --decode > lib/config.dart
          printf '%s' "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
          grep -Eq '^storeFile[[:space:]]*=[[:space:]]*release-key\.jks[[:space:]]*$' android/key.properties || { echo 'Expected storeFile=release-key.jks in key.properties' >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/play-service-account.json
          printf '%s' "$FASTLANE_ENV_BASE64" | base64 --decode > android/fastlane/.env
          chmod 600 android/key.properties android/app/release-key.jks android/fastlane/play-service-account.json android/fastlane/.env
      - run: flutter pub get
      - name: Build AAB and create production draft
        working-directory: android
        run: bundle exec fastlane android production_draft

  notify:
    needs: [validate_source, upload]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send upload result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VALIDATION_RESULT: ${{ needs.validate_source.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
        run: |
          set -euo pipefail
          test -n "$SLACK_WEBHOOK_URL" || { echo 'Missing repository secret: SLACK_WEBHOOK_URL' >&2; exit 1; }
          if [[ "$VALIDATION_RESULT" != success ]]; then
            summary="❌ Android production source validation ${VALIDATION_RESULT}; upload did not run"
          elif [[ "$UPLOAD_RESULT" == success ]]; then
            summary='✅ Android production draft created'
          else
            summary="❌ Android production draft upload ${UPLOAD_RESULT}"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message=$(printf '%s\nRef: %s\n<%s|View GitHub Actions run>' "$summary" "$GITHUB_REF_NAME" "$run_url")
          payload=$(MESSAGE="$message" python3 -c 'import json, os; print(json.dumps({"text": os.environ["MESSAGE"]}))')
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
