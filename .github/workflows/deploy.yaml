name: Android Build & Deploy

on:
  push:
    tags:
      - "v*-dev"
      - "v*"

  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"
  JAVA_VERSION: "17"

jobs:
  build-and-deploy-android:
    name: Build & Deploy Android APK
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-dev') && 'dev' || 'prod' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Environment
        run: |
          TAG=${GITHUB_REF_NAME}

          if [[ "$TAG" == *"-dev" ]]; then
            echo "APP_ID=${{ secrets.FIREBASE_APP_ID_ANDROID }}" >> $GITHUB_ENV
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "APK_NAME=app-release-dev.apk" >> $GITHUB_ENV
          else
            echo "APP_ID=${{ secrets.FIREBASE_APP_ID_PROD }}" >> $GITHUB_ENV
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "APK_NAME=app-release-prod.apk" >> $GITHUB_ENV
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Decode firebase_options.dart
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          echo "✅Generated firebase_options.dart:"
         
      
      - name: Decode Google Services
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          echo "✅Generated google-services.json:"
       

      - name: Decode config.dart
        run: |
          echo "${{ secrets.CONFIG_DART_BASE64 }}" | base64 --decode > lib/config.dart

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release-key.jks" >> android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs || true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ env.APK_NAME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: park-android-${{ env.ENV_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          releaseNotes: |
            App Name: ${{env.APK_NAME }}
            Environment: ${{ env.ENV_NAME }}
            Branch/Tag: ${{ github.ref_name }}
            Commit: ${{ github.sha }}