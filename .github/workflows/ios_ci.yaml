name: iOS build check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Prepare development build configuration
        env:
          CONFIG_DART_BASE64: ${{ secrets.DEV_CONFIG_DART_BASE64 }}
          FIREBASE_OPTIONS_BASE64: ${{ secrets.DEV_FIREBASE_OPTIONS_BASE64 }}
          GOOGLE_SERVICE_PLIST_BASE64: ${{ secrets.DEV_GOOGLE_SERVICE_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          for name in CONFIG_DART_BASE64 FIREBASE_OPTIONS_BASE64 GOOGLE_SERVICE_PLIST_BASE64; do
            test -n "${!name}" || { echo "Missing secret: ${name}" >&2; exit 1; }
          done
          printf '%s' "$CONFIG_DART_BASE64" | base64 --decode > lib/config.dart
          printf '%s' "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart
          printf '%s' "$GOOGLE_SERVICE_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

  notify:
    needs: build
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send build result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo '::warning::SLACK_WEBHOOK_URL is unavailable; no Slack message was sent'
            exit 0
          fi
          if [[ "$BUILD_RESULT" == success ]]; then
            summary='✅ iOS CI build succeeded'
          else
            summary="❌ iOS CI build failed (${BUILD_RESULT})"
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$PR_NUMBER" ]]; then
            source="PR #${PR_NUMBER}"
          else
            source="Branch: ${GITHUB_REF_NAME}"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message=$(printf '%s\n%s\n<%s|View GitHub Actions run>' "$summary" "$source" "$run_url")
          payload=$(MESSAGE="$message" python3 -c 'import json, os; print(json.dumps({"text": os.environ["MESSAGE"]}))')
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
